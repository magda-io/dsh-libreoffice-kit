# Functional qualification of a LibreOffice Kit release of this repository on native Linux x64
# and arm64 runners. A thin wrapper around the qualification scripts, so a run here produces the
# same evidence as running them by hand on any Docker host:
#   qualification/download-release.sh <tag> candidate
#   qualification/run-comparison.sh --fixtures fixtures candidate evidence
# The engine is not rebuilt here: its full-LTO link needs ~22 GiB.
name: MAGDA qualification

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to qualify (a draft release's intended tag also works)
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kit-qualification qualification
      - name: Download pinned fixtures and generate edge cases once for both architectures
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work kit-qualification node qualification/fetch-fixtures.mjs fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures
          retention-days: 7

  qualify:
    needs: fixtures
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      # Draft releases, which hold unpublished candidates, are visible only with write access.
      # The token is passed to the download step alone, never to the installed packages.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures
      - name: Download and verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: qualification/download-release.sh "$RELEASE" candidate
      - name: Run the full comparison
        run: qualification/run-comparison.sh --fixtures fixtures candidate evidence
      - name: Summary
        if: always()
        run: |
          { echo "## ${{ runner.arch }}"; echo; cat evidence/reports/summary.md 2>/dev/null || echo 'No report.'; echo; echo '```'; (cd candidate && sha256sum *.tgz); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ runner.arch }}
          path: |
            evidence/environment.json
            evidence/outputs.sha256
            evidence/reports
            evidence/sets/*/results.json
            evidence/comparison-evidence.tar.gz
          retention-days: 90

  cross-arch:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: evidence
      - run: docker build -t kit-qualification qualification
      - name: Compare x64 and arm64 (reported, not required)
        run: |
          set -euo pipefail
          for arch in X64 ARM64; do mkdir -p "raw/$arch" && tar -C "raw/$arch" -xzf "evidence/evidence-$arch/comparison-evidence.tar.gz"; done
          run() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work kit-qualification python3 qualification/compare.py "$@"; }
          for set in reference candidate; do
            run raw/X64/sets/$set raw/ARM64/sets/$set cross-arch-$set.json --label "$set: x64 vs arm64" --summary summary.md
          done
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-arch-reports
          path: cross-arch-*.json
          retention-days: 90

  # The WASM engine on every OS (the wasm-on-every-os delta): a portable Node-only smoke test,
  # asserting font-independent results recorded from the official 0.1.5 packages on Linux.
  smoke:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # see the qualify job: draft releases need write access to read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - name: Download and verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: qualification/download-release.sh "$RELEASE" packages
      - name: Install with npm on this OS
        run: |
          mkdir -p install && cd install && echo '{"private":true}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --loglevel=error ../packages/*.tgz
          ls node_modules/@deepseek-ai
      - run: node qualification/fetch-fixtures.mjs fixtures --no-generate
      - name: Smoke test on ${{ runner.os }} ${{ runner.arch }}
        run: node qualification/smoke.mjs install/node_modules/@deepseek-ai/libreoffice-kit fixtures out | tee smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ runner.os }}-${{ runner.arch }}
          path: smoke.json
          retention-days: 90
