# Functional qualification of a LibreOffice Kit release of this repository on Linux x64 and
# arm64. The engine is not rebuilt here (its full-LTO link needs ~22 GiB): the jobs install the
# release's adapter and WASM tarballs and the official 0.1.5 npm packages, run the same
# fixtures through both, and require identical results.
name: MAGDA qualification

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to qualify (a draft release's intended tag also works)
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kit-qualification qualification
      - name: Download pinned fixtures and generate edge cases
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work kit-qualification node qualification/fetch-fixtures.mjs fixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures
          retention-days: 7

  qualify:
    needs: fixtures
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        set: [reference, candidate]
    runs-on: ${{ matrix.runner }}
    permissions:
      # Draft releases, which hold unpublished candidates, are visible only with write access.
      # The token is passed to the download step alone, never to the installed packages.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
          path: fixtures
      - name: Download the release's tarballs and checksums
        if: matrix.set == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == env.TAG) | .id")
          [ "$(printf '%s\n' "$release" | grep -c .)" = 1 ] || { echo "expected exactly one release tagged $TAG" >&2; exit 1; }
          mkdir -p packages
          gh api "repos/$GITHUB_REPOSITORY/releases/$release/assets" --paginate \
            --jq '.[] | select((.name | endswith(".tgz")) or .name == "SHA256SUMS") | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "packages/$name"
            done
      - name: Prepare and verify ${{ matrix.set }} packages
        run: |
          node qualification/packages.mjs ${{ matrix.set }} packages
          { echo "### ${{ runner.arch }} ${{ matrix.set }}"; echo; echo '```'; (cd packages && sha256sum *.tgz); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: docker build -t kit-qualification qualification
      - name: Install and run the fixtures
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work kit-qualification sh -c '
            set -e
            mkdir -p install && cd install && echo "{\"private\":true}" > package.json
            npm install --ignore-scripts --no-audit --no-fund --loglevel=error ../packages/*.tgz
            cd .. && node -p "process.arch + \" \" + process.version"
            node qualification/run.mjs install/node_modules/@deepseek-ai/libreoffice-kit fixtures out'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ runner.arch }}-${{ matrix.set }}
          path: |
            out/results.json
            out/png
          retention-days: 14

  compare:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: results
      - run: docker build -t kit-qualification qualification
      - name: Release must equal official 0.1.5 on each architecture
        run: |
          set -euo pipefail
          run() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/work kit-qualification python3 qualification/compare.py "$@"; }
          status=0
          for arch in X64 ARM64; do
            run results/results-$arch-reference results/results-$arch-candidate report-$arch.json --strict \
              --label "$arch: candidate vs official 0.1.5" --summary summary.md || status=1
          done
          # Cross-architecture equality is reported, not required.
          run results/results-X64-reference results/results-ARM64-reference report-reference-x64-arm64.json \
            --label "official 0.1.5: x64 vs arm64" --summary summary.md
          run results/results-X64-candidate results/results-ARM64-candidate report-candidate-x64-arm64.json \
            --label "candidate: x64 vs arm64" --summary summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: comparison-reports
          path: report-*.json
          retention-days: 30
